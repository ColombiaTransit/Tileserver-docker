services:
  tileserver:
    image: ghcr.io/colombiatransit/tileserver-docker:latest
    # Of lokaal bouwen vanuit deze repo:
    # build: .
    container_name: tileserver-colombia
    restart: unless-stopped

    environment:
      PUBLIC_URL: https://tileserver.colombiatransit.co/

    volumes:
      # colombia.mbtiles en colombia-terrain.mbtiles (via ./update-tiles.sh)
      - ./data:/data

    networks:
      - traefik

    labels:
      - traefik.enable=true
      - traefik.http.services.tileserver.loadbalancer.server.port=8080

networks:
  traefik:
    external: true
