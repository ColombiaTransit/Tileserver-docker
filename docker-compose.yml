services:
  tileserver:
    image: ghcr.io/colombiatransit/tileserver-docker:latest
    # Of lokaal bouwen vanuit deze repo:
    # build: .
    container_name: tileserver-colombia
    restart: unless-stopped

    environment:
      PUBLIC_URL: https://tileserver.colombiatransit.co/
      # Bij elke start worden nieuwe tiles opgehaald; zet op "false" om dat over te slaan
      TILES_UPDATE: "true"

    volumes:
      # colombia.mbtiles en colombia-terrain.mbtiles (~4,6 GB), opgehaald bij het opstarten
      - tiles:/data

    networks:
      - traefik

    labels:
      - traefik.enable=true
      - traefik.http.services.tileserver.loadbalancer.server.port=8080

volumes:
  tiles:

networks:
  traefik:
    external: true
