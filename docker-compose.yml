services:
  tileserver:
    image: maptiler/tileserver-gl:v5.6.0
    container_name: tileserver-colombia
    restart: unless-stopped

    volumes:
      - ./data:/data
      - ./config.json:/data/config.json:ro
      - ./styles:/data/styles:ro

    command:
      - --config
      - /data/config.json
      - --public_url
      - https://apiv2.colombiatransit.co/api/tiles/

    networks:
      - traefik

    labels:
      - traefik.enable=true
      - traefik.http.services.tileserver.loadbalancer.server.port=8080

networks:
  traefik:
    external: true
