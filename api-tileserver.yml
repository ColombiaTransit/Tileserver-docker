http:

  ## TileServer GL via apiv2.colombiatransit.co/api/tiles ##
  routers:
    api-tileserver:
      entryPoints:
        - web
      rule: "Host(`apiv2.colombiatransit.co`) && PathPrefix(`/api/tiles`)"
      service: tileserver@docker
      middlewares:
        - api-tileserver@file

  ## MIDDLEWARES ##
  middlewares:
    api-tileserver:
      chain:
        middlewares:
          - default-headers
          - real-ip
          - compress-gzip
          - cleanup-tileserver-request
    # /api/tiles/styles/... -> /styles/...
    cleanup-tileserver-request:
      stripPrefix:
        prefixes:
          - "/api/tiles"
