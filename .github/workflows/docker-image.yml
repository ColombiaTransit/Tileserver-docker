name: docker-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/docker-image.yml
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/docker-image.yml
  workflow_dispatch: ~

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tileserver-docker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tileserver-versie uit de Dockerfile
        id: version
        run: echo "tileserver=$(sed -n 's/^ARG TILESERVER_VERSION=//p' Dockerfile)" >> $GITHUB_OUTPUT

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.tileserver }},enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.description=TileServer GL met Colombia vector- en terrain-tiles: Positron, OSM Bright en OSM Liberty (2D en 3D)
            org.opencontainers.image.licenses=BSD-3-Clause

      - name: Build en push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rooktest met kleine test-mbtiles
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          img=$(echo "${IMAGE}:sha-${GITHUB_SHA::7}" | tr "[:upper:]" "[:lower:]")
          mkdir -p testdata
          python3 docker/make_test_mbtiles.py testdata
          chmod -R a+rwX testdata
          docker run -d --name ts -p 8080:8080 -v "$PWD/testdata:/data" \
            -e PUBLIC_URL=http://localhost:8080/ -e TILES_UPDATE=false "$img"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health >/dev/null && break
            sleep 2
          done
          docker logs ts
          curl -sf http://localhost:8080/styles.json | python3 -c '
          import json,sys
          ids={s["id"] for s in json.load(sys.stdin)}
          want={f"{b}{v}" for b in ("positron","osm-bright","osm-liberty") for v in ("","-3d")}
          missing=want-ids
          print("styles:", sorted(ids))
          sys.exit(f"ontbrekend: {missing}" if missing else 0)'
          for s in positron osm-bright osm-liberty; do
            curl -sf -o /dev/null "http://localhost:8080/styles/$s/sprite@2x.png"
          done
          curl -sf -o /dev/null "http://localhost:8080/fonts/Noto%20Sans%20Regular/0-255.pbf"
          curl -sf -o /dev/null "http://localhost:8080/fonts/Roboto%20Regular/0-255.pbf"
          curl -sf -o /dev/null "http://localhost:8080/data/colombia-terrain/0/0/0.png"
          curl -sf -o /dev/null "http://localhost:8080/styles/positron/256/0/0/0.png"
          echo "Rooktest geslaagd"

      - name: Rooktest ophalen van tiles bij opstarten
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          img=$(echo "${IMAGE}:sha-${GITHUB_SHA::7}" | tr "[:upper:]" "[:lower:]")
          # Nep-releases met dezelfde opbouw als de echte (terrain in 3 delen)
          python3 - <<'PY'
          import hashlib, json, os, shutil
          src = "testdata"
          os.makedirs("www/vec", exist_ok=True)
          os.makedirs("www/releases/latest/download", exist_ok=True)
          os.makedirs("www/releases/download/v9.9.9", exist_ok=True)
          v = open(f"{src}/colombia.mbtiles", "rb").read()
          shutil.copy(f"{src}/colombia.mbtiles", "www/vec/colombia.mbtiles")
          open("www/vec/colombia.mbtiles.sha256", "w").write(hashlib.sha256(v).hexdigest() + "\n")
          t = open(f"{src}/colombia-terrain.mbtiles", "rb").read()
          n = len(t) // 3 + 1
          parts = []
          for i in range(3):
              chunk = t[i * n:(i + 1) * n]
              name = f"colombia-terrain.mbtiles.part-{i:03d}"
              open(f"www/releases/download/v9.9.9/{name}", "wb").write(chunk)
              parts.append({"file": name, "bytes": len(chunk), "sha256": hashlib.sha256(chunk).hexdigest()})
          json.dump({"release_version": "v9.9.9", "merged_mbtiles_sha256": hashlib.sha256(t).hexdigest(),
                     "merged_mbtiles_bytes": len(t), "parts": parts},
                    open("www/releases/latest/download/colombia-terrain.manifest.json", "w"))
          PY
          (cd www && python3 -m http.server 9077 >/dev/null 2>&1 &)
          mkdir -p fetched && chmod 777 fetched
          docker run -d --name ts2 --network host -v "$PWD/fetched:/data" \
            -e VECTOR_BASE_URL=http://127.0.0.1:9077/vec \
            -e TERRAIN_MANIFEST_URL=http://127.0.0.1:9077/releases/latest/download/colombia-terrain.manifest.json \
            "$img" --port 8081
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/health >/dev/null && break
            sleep 2
          done
          docker logs ts2
          cmp fetched/colombia.mbtiles testdata/colombia.mbtiles
          cmp fetched/colombia-terrain.mbtiles testdata/colombia-terrain.mbtiles
          curl -sf -o /dev/null http://localhost:8081/data/colombia-terrain/0/0/0.png
          # Tweede start: niets opnieuw downloaden
          docker restart ts2 >/dev/null; sleep 5
          [ "$(docker logs ts2 2>&1 | grep -c "al de nieuwste")" -ge 2 ]
          echo "Ophalen bij opstarten werkt"

      - name: Logs bij fout
        if: failure()
        run: |
          docker logs ts || true
          docker logs ts2 || true
